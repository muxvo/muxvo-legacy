<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muxvo Fixture (dev-only)</title>
    <style>
      /* 视觉回归：禁动画/过渡/光标，保证截图确定性 */
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
        caret-color: transparent !important;
      }
    </style>
    <script>
      // ⚠️ dev-only 入口：仅供探针 3 视觉回归 golden 截图（muxvo/tools/visual-diff）。
      // 生产 bundle 不含本页面；__MUXVO_FIXTURE__ 标记只在这里置位。
      window.__MUXVO_FIXTURE__ = true;
      window.__MUXVO_FIXTURE_DATA__ = null;
      window.__fixtureReady = false;

      function fxFindTerminalByCwd(cwd) {
        var data = window.__MUXVO_FIXTURE_DATA__;
        if (!data || !data.terminals) return null;
        for (var i = 0; i < data.terminals.length; i++) {
          var t = data.terminals[i];
          if (cwd === t.cwd || cwd.indexOf(t.cwd + '/') === 0) return t;
        }
        return null;
      }

      // window.api 替身：fixture 页面无 Electron preload，组件触达的 IPC 面在此给定确定性答案
      window.api = {
        app: {
          getHomePath: function () {
            var data = window.__MUXVO_FIXTURE_DATA__;
            return (data && data.homePath) || '/Users/rl';
          },
        },
        worktree: {
          detectRepo: function (cwd) {
            var t = fxFindTerminalByCwd(cwd);
            var marker = '/.worktrees/';
            var idx = cwd.indexOf(marker);
            return Promise.resolve({
              success: true,
              data: {
                isRepo: !!(t && t.isGitRepo),
                repoPath: idx >= 0 ? cwd.substring(0, idx) : cwd,
              },
            });
          },
          list: function () {
            var data = window.__MUXVO_FIXTURE_DATA__;
            // worktree-popover 屏（M2 B1）：fixture 给定完整 WorktreeInfo 列表
            if (data && data.worktree && data.worktree.worktrees) {
              return Promise.resolve({ success: true, data: data.worktree.worktrees });
            }
            var registered = [];
            if (data && data.terminals) {
              data.terminals.forEach(function (t) {
                if (t.cwd.indexOf('/.worktrees/') >= 0 && t.worktreeRegistered) {
                  registered.push({ path: t.cwd });
                }
              });
            }
            return Promise.resolve({ success: true, data: registered });
          },
          preCheck: function () {
            // worktree-popover 屏（M2 B1）：大仓警告由 fixture 给定（wt-warning）
            var data = window.__MUXVO_FIXTURE_DATA__;
            var warning = (data && data.worktree && data.worktree.warning) || null;
            return Promise.resolve({ success: true, data: { warning: warning } });
          },
        },
        fs: {
          showFileMenu: function () {},
        },
        // M2 B3（配置面板簇）：config.* 一组替身，全部由 fixture 按屏 payload 单一数据源驱动
        config: {
          getResources: function (type) {
            var data = window.__MUXVO_FIXTURE_DATA__;
            if (type === 'skills' && data && data.skills && data.skills.items) {
              return Promise.resolve({
                resources: data.skills.items.map(function (i) {
                  return { name: i.name, path: i.path, source: i.source, level: i.level };
                }),
              });
            }
            return Promise.resolve({ resources: [] });
          },
          getResourceContent: function (p) {
            var data = window.__MUXVO_FIXTURE_DATA__;
            var files = (data && data.files) || {};
            if (Object.prototype.hasOwnProperty.call(files, p)) {
              return Promise.resolve({ content: files[p] });
            }
            return Promise.reject(new Error('fixture: no file ' + p));
          },
          onResourceChange: function () { return function () {}; },
          // hooks-panel 读 settings.hooks；plugin-panel 读 settings.enabledPlugins
          getSettings: function () {
            var data = window.__MUXVO_FIXTURE_DATA__ || {};
            var settings = {};
            if (data.hooks && data.hooks.settings && data.hooks.settings.hooks) {
              settings.hooks = data.hooks.settings.hooks;
            }
            if (data.plugins && data.plugins.items) {
              var enabled = {};
              data.plugins.items.forEach(function (i) { enabled[i.id] = !!i.enabled; });
              settings.enabledPlugins = enabled;
            }
            return Promise.resolve({ settings: settings });
          },
          saveSettings: function () { return Promise.resolve({ success: true }); },
        },
        terminal: {
          list: function () { return Promise.resolve({ success: true, data: [] }); },
          onExit: function () { return function () {}; },
          onStateChange: function () { return function () {}; },
          onListUpdated: function () { return function () {}; },
          onCwdChange: function () { return function () {}; },
          acknowledgeWaiting: function () {},
          setName: function () { return Promise.resolve({ success: true }); },
        },
        chat: {
          setSessionName: function () { return Promise.resolve({ success: true }); },
        },
        // M2 B2（modal 簇）：AuthContext 挂载即调 getStatus / 订阅两推送（AuthContext.tsx:100-137）
        // M2 B3：fixture.auth 非空 → 登录态（头像一律 data-URI，确定性铁律）；缺省未登录（B2 行为不变）
        auth: {
          getStatus: function () {
            var data = window.__MUXVO_FIXTURE_DATA__;
            var a = data && data.auth;
            if (a) {
              return Promise.resolve({
                success: true,
                data: {
                  loggedIn: true,
                  user: {
                    username: a.username,
                    email: a.email,
                    avatarUrl: a.avatarDataUri,
                    provider: a.provider,
                  },
                },
              });
            }
            return Promise.resolve({ success: true, data: { loggedIn: false } });
          },
          onSessionExpired: function () { return function () {}; },
          onStatusChange: function () { return function () {}; },
        },
      };
      // ── M2 B3 fs 替身：files/dirs 字典 + mcp/plugins 按 payload 反拼配置文件答案 ──
      // mcp：useMcpConfig 读 4 个全局配置路径（useMcpConfig.ts:90-94），按 scope 反拼 JSON
      window.__fxMcpFileAnswer = function (p) {
        var data = window.__MUXVO_FIXTURE_DATA__;
        if (!data || !data.mcp || !data.mcp.servers) return null;
        var home = (data.homePath) || '/Users/rl';
        var scopeByPath = {};
        scopeByPath[home + '/.claude.json'] = 'global';
        scopeByPath[home + '/Library/Application Support/Claude/claude_desktop_config.json'] = 'desktop';
        scopeByPath[home + '/.gemini/settings.json'] = 'gemini';
        var scope = scopeByPath[p];
        if (!scope) return null;
        var mcpServers = {};
        var found = false;
        data.mcp.servers.forEach(function (s) {
          if (s.scope !== scope) return;
          found = true;
          var entry = {};
          if (s.command) entry.command = s.command;
          if (s.args) entry.args = s.args;
          if (s.url) entry.url = s.url;
          if (s.headers) entry.headers = s.headers;
          if (s.env) entry.env = s.env;
          mcpServers[s.name] = entry;
        });
        if (!found) return null;
        return JSON.stringify({ mcpServers: mcpServers });
      };
      // plugins：usePluginConfig 读 installed_plugins.json + manifest；error 态 reject 定值 Error
      window.__fxPluginsFileAnswer = function (p) {
        var data = window.__MUXVO_FIXTURE_DATA__;
        if (!data || !data.plugins) return null;
        var home = (data.homePath) || '/Users/rl';
        if (p === home + '/.claude/plugins/installed_plugins.json') {
          if (data.plugins.error) return { reject: new Error(data.plugins.error) };
          var map = {};
          (data.plugins.items || []).forEach(function (i) {
            map[i.id] = [{
              version: i.version,
              scope: i.scope,
              installPath: i.installPath,
              installedAt: i.installedAt,
              lastUpdated: i.lastUpdated,
            }];
          });
          return JSON.stringify({ version: 1, plugins: map });
        }
        var items = data.plugins.items || [];
        for (var i = 0; i < items.length; i++) {
          if (p === items[i].installPath + '/.claude-plugin/plugin.json' && items[i].manifest) {
            return JSON.stringify(items[i].manifest);
          }
        }
        return null;
      };
      window.api.fs.readFile = function (p) {
        var data = window.__MUXVO_FIXTURE_DATA__ || {};
        var files = data.files || {};
        if (Object.prototype.hasOwnProperty.call(files, p)) {
          return Promise.resolve({ success: true, data: { content: files[p] } });
        }
        var mcp = window.__fxMcpFileAnswer(p);
        if (mcp !== null) return Promise.resolve({ success: true, data: { content: mcp } });
        var pl = window.__fxPluginsFileAnswer(p);
        if (pl && pl.reject) return Promise.reject(pl.reject);
        if (typeof pl === 'string') return Promise.resolve({ success: true, data: { content: pl } });
        return Promise.resolve({ success: false });
      };
      window.api.fs.writeFile = function () { return Promise.resolve({ success: true }); };
      // readDir：skills 文件树走 dirs 字典；plugin contents 扫描按 payload 反拼目录列表
      window.api.fs.readDir = function (p) {
        var data = window.__MUXVO_FIXTURE_DATA__ || {};
        var dirs = data.dirs || {};
        if (Object.prototype.hasOwnProperty.call(dirs, p)) {
          return Promise.resolve({
            success: true,
            data: dirs[p].map(function (e) {
              // B4：size 透传（FilePanel 的 meta 尺寸徽记数据源）；undefined 即无徽记
              return { name: e.name, isDirectory: e.isDirectory, path: p + '/' + e.name, size: e.size };
            }),
          });
        }
        var items = (data.plugins && data.plugins.items) || [];
        for (var i = 0; i < items.length; i++) {
          var c = items[i].contents;
          if (!c) continue;
          var base = items[i].installPath;
          var listing = null;
          if (p === base + '/commands') listing = c.commands.map(function (n) { return { name: n + '.md', isDirectory: false }; });
          else if (p === base + '/skills') listing = c.skills.map(function (n) { return { name: n, isDirectory: true }; });
          else if (p === base + '/hooks') listing = c.hooks.map(function (n) { return { name: n, isDirectory: false }; });
          else if (p === base + '/agents') listing = c.agents.map(function (n) { return { name: n + '.md', isDirectory: false }; });
          if (listing) {
            return Promise.resolve({
              success: true,
              data: listing.map(function (e) { return { name: e.name, isDirectory: e.isDirectory, path: p + '/' + e.name }; }),
            });
          }
        }
        return Promise.resolve({ success: false });
      };
      // ── M2 B3 更新进度替身：订阅即同步回调冻结状态（done 态 fade 动画中帧，spec 跳过不提供）──
      window.api.app.onUpdateDownloading = function (callback) {
        var data = window.__MUXVO_FIXTURE_DATA__;
        var u = data && data.update;
        if (u && u.state === 'downloading') {
          callback({ percent: u.percent, bytesPerSecond: u.bytesPerSecond, transferred: u.transferred, total: u.total });
        }
        return function () {};
      };
      window.api.app.onUpdateDownloaded = function () { return function () {}; };
      window.api.app.onUpdateError = function (callback) {
        var data = window.__MUXVO_FIXTURE_DATA__;
        var u = data && data.update;
        if (u && u.state === 'error') callback();
        return function () {};
      };
      // M2 B2：getConfig 改读 fixture（SettingsModal 读 settings.config；
      // WorkspaceManagerModal 读 savedWorkspaces）；无 fixture 数据时维持空对象（B1 行为不变）
      window.api.app.getConfig = function () {
        var data = window.__MUXVO_FIXTURE_DATA__ || {};
        var config = {};
        var k;
        if (data.settings && data.settings.config) {
          for (k in data.settings.config) config[k] = data.settings.config[k];
        }
        if (data.workspace && data.workspace.workspaces) {
          config.savedWorkspaces = data.workspace.workspaces;
        }
        // M2 B4（file 簇）：列宽/隐藏文件开关（FilePanel/FileTempView 挂载即 getConfig）
        if (data.fileConfig) {
          for (k in data.fileConfig) config[k] = data.fileConfig[k];
        }
        return Promise.resolve({ success: true, data: config });
      };
      window.api.app.saveConfig = function () { return Promise.resolve({ success: true }); };
      window.api.app.getPreferences = function () { return Promise.resolve({ success: true, data: {} }); };
      window.api.app.savePreferences = function () { return Promise.resolve({ success: true }); };
      window.api.app.checkForUpdate = function () { return Promise.resolve({ success: true }); };
      window.api.app.downloadUpdate = function () { return Promise.resolve({ success: true }); };
      // settings-modal：订阅即同步回调（fixture settings.update 非 null → 'available' 态确定性可截）
      window.api.app.onUpdateAvailable = function (callback) {
        var data = window.__MUXVO_FIXTURE_DATA__;
        var update = data && data.settings && data.settings.update;
        if (update) callback({ version: update.version, releaseDate: '2026-06-01' });
        return function () {};
      };
      // whats-new-modal：缺此方法会 TypeError 崩（WhatsNewModal.tsx:25 直接 .then）
      window.api.app.getReleaseNotes = function () {
        var data = window.__MUXVO_FIXTURE_DATA__;
        var entries = (data && data.whatsNew && data.whatsNew.entries) || [];
        return Promise.resolve(entries);
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./fixture-main.tsx"></script>
  </body>
</html>
